<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Graphic Design Portfolio</title>

<style>
body{
    font-family: Arial, sans-serif;
    margin:0;
    background:#f5f5f5;
}

header{
    background:#222;
    color:white;
    text-align:center;
    padding:60px 20px;
}

section{
    max-width:1200px;
    margin:auto;
    padding:40px 20px;
}

.gallery{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
    gap:20px;
}

.gallery img{
    width:100%;
    border-radius:10px;
}

.card{
    background:white;
    padding:20px;
    border-radius:10px;
}

footer{
    background:#222;
    color:white;
    text-align:center;
    padding:20px;
}
</style>

</head>
<body>

<header>
    <h1>Punlork Design</h1>
    <p>Graphic Designer</p>
</header>

<section>
    <div class="card">
        <h2>About Me</h2>
        <p>
            I specialize in graphic design, product packaging,
            advertising posters, branding and social media content.
        </p>
    </div>
</section>

<section>
    <h2>My Portfolio</h2>

    <div class="gallery">
    <img src="images/poster1.jpg" alt="Fertilizer Poster">
    <img src="images/poster2.jpg" alt="Herbicide Poster">
    <img src="images/poster3.jpg" alt="Insecticide Poster">
    <img src="images/poster4.jpg" alt="Product Advertisement">
    </div>
</section>

<section>
    <div class="card">
        <h2>Contact</h2>
        <p>Email: punlorksem111@email.com</p>
        <p>Telegram: @Sem_Punlork</p>
    </div>
</section>

<footer>
    © 2026 Sem Punlork
</footer>

</body>
</html>
